name: 'CD'
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - staging
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:

  prepare:
    name: 'Prepare'
    uses: rfcx/cicd/.github/workflows/notify-prepare.yaml@master
    with:
      repo: rfcx-api
      workflow-id: cd.yaml
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  configure:
    name: 'Configure'
    runs-on: ubuntu-latest
    needs: [prepare]
    outputs:
      namespace: ${{ steps.configuration.outputs.namespace }}
    steps:
      - name: 'Conditional environment'
        id: configuration
        run: |
          if [[ "${{ needs.prepare.outputs.branch-name }}" == "master" ]]; then
            echo "::set-output name=namespace::production"
          elif [[ "${{ needs.prepare.outputs.branch-name }}" == "staging" ]]; then
            echo "::set-output name=namespace::staging"
          else
            echo "::set-output name=namespace::testing"
          fi

  deploy-rfcx-local:
    name: 'Deploy: rfcx-local'
    needs: [prepare, configure]
    if: ${{ needs.configure.outputs.namespace == 'production' }}
    uses: rfcx/cicd/.github/workflows/rfcx-local-cd.yaml@master
    with:
      repo: rfcx-api
      dockerfile: build/Dockerfile
      targets: '["core-api","core-tasks","noncore-api","noncore-mqtt"]'
      # BuildKit registry layer cache (rfcx/cicd#10, 2026-09-04). All FOUR
      # targets derive from one shared `build` stage (apt sox/ffmpeg/imagemagick
      # + `yarn --production --frozen-lockfile`), and the CD matrix runs
      # SERIALLY on the single-replica rfcx-local-deployment-runner -- so that
      # stage was recomputed four times per merge (last run: 174/141/129/154s,
      # 20.8 min wall clock).
      #
      # Measured on the CD runner before enabling: core-api cold 142s exporting
      # cache; core-tasks on a FRESH builder importing it = 36s with apt + yarn
      # both CACHED. A core/ source change keeps apt + yarn cached and re-runs
      # only the COPY layers. Fails safe: a missing/GC'd cache tag is a miss,
      # not a failure. Same pattern proven on rfcx/arbimon (14.6 -> 2.5 min).
      build-cache: true
      deployments: |
        [
          {"name": "core-api",     "image": "core-api"},
          {"name": "core-tasks",   "image": "core-tasks"},
          {"name": "noncore-api",  "image": "noncore-api"},
          {"name": "noncore-mqtt", "image": "noncore-mqtt"},
          {"name": "media-api",    "image": "core-api"}
        ]


  notify:
    name: 'Notify'
    if: ${{ always() }}
    needs: [prepare, deploy-rfcx-local]
    uses: rfcx/cicd/.github/workflows/notify-send.yaml@master
    with:
      repo: rfcx-api
      branch-name: ${{ needs.prepare.outputs.branch-name }}
      workflow-id: cd.yaml
      previous-run-id: ${{ needs.prepare.outputs.previous-run-id }}
      status: ${{ needs.deploy-rfcx-local.result }}
      always: true
      notification-title: 'CD: APIs'
      notification-footer: "Deploy (rfcx-local): ${{ needs.deploy-rfcx-local.result || 'n/a' }}"
      notification-success-statement: '{0} deployed the build!'
    secrets:
      slack-webhook: ${{ secrets.SLACK_ALERT_COREDT_WEBHOOK }}
      github-token: ${{ secrets.GITHUB_TOKEN }}
    